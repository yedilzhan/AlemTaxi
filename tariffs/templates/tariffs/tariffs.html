<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Такси — Тарифы</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    th { background: #f4f4f4; }
  </style>
</head>
<body>
  <h1>Тарифы</h1>
  {% if tariffs %}
  <table>
    <tr>
      <th>Тариф</th>
      <th>Подача, тг</th>
      <th>За км, тг</th>
      <th>Пример: {{ distance_km }} км, тг</th>
    </tr>
    {% for t in tariffs %}
    <tr>
      <td>{{ t.name }}</td>
      <td>{{ t.base_price }}</td>
      <td>{{ t.rate_per_km }}</td>
      <td>{{ t.example_price }}</td>
    </tr>
    {% endfor %}
  </table>
  {% else %}
  <p>Тарифов пока нет.</p>
  {% endif %}
</body>
</html>
