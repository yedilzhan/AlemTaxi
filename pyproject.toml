[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# RUF012 спорит с обычным стилем Django (списки в Meta и в admin.py)
ignore = ["RUF012"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["*/migrations/*", "*/test*.py", "manage.py", "config/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
